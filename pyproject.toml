[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "certivity"
version = "0.1.0"
description = "Specification-to-requirements pipeline for the Certivity industrial AI hackathon"
requires-python = ">=3.12"
# Root dependencies for all four components. Owners send additions to the app owner (Teammate 4).
dependencies = [
    # app / API (Teammate 4)
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    # corpus (Teammate 2): PDF parsing and page rendering
    "pymupdf>=1.24",
    # quality / evaluation (Teammate 3): the official validator needs jsonschema
    "jsonschema>=4.21",
    # agent / llm (Anushree): add the chosen provider SDK here once selected
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
certivity = "certivity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
